<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            background-color: cadetblue;
        }
        .contents{
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .formContent{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            border: 1px solid;
            padding: 10px 30px;
        }
        #formDataDiri{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
    
    </style>
    <title>EventForm</title>
</head>
<body>
    <div class="contents">
        <div class="formContent">
            <h2>Isi data diri</h2>
            <form action="" id="formDataDiri">
                <div class="formElement">
                    <label for="inputNama">Nama :</label>
                    <br>
                    <input id="inputNama" type="text" name="nama" required>
                </div>
                <div class="formElement">
                    <label for="inputDomisili">Domisili :</label>
                    <br>
                    <input type="text" name="domisili" id="inputDomisili" required>
                </div>

                <div class="formElement">
                    <input type="submit" value="submit data" id="submitButton">
                </div>
            </form>
        </div>
        <h3 id="messageAfterSubmit"></h3>
    </div>
    <script src="formEvent.js"></script>
</body>
</html>
