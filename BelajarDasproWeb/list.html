<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Unordered List -->
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>
    <!-- Ordered List -->
    <ol>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ol>

    <!-- Ordered List with Roman Numerals -->
    <ol type="I">
      <li>Item I</li>
      <li>Item II</li>
      <li>Item III</li>
    </ol>
    <!-- Ordered List with Letters -->
    <ol type="A">
      <li>Item A</li>
      <li>Item B</li>
      <li>Item C</li>
      <ol reversed>
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
      </ol>
    </ol>
  </body>
</html>
